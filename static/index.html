<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic WebApp Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #172033;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #f87171;
      --danger-bg: #3b1d1d;
      --success: #34d399;
      --code-bg: #0b1220;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      font-size: 0.95rem;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      color: #fff;
      background: var(--accent);
      transition: background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    button.secondary:hover:not(:disabled) {
      background: var(--panel-alt);
    }

    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .status.visible {
      display: block;
    }

    .status.loading {
      background: var(--panel-alt);
      color: var(--muted);
    }

    .status.error {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--muted);
      border-top-color: transparent;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: -2px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab {
      background: none;
      color: var(--muted);
      border-radius: 0;
      padding: 8px 14px;
      border-bottom: 2px solid transparent;
    }

    .tab:hover:not(:disabled) {
      background: none;
      color: var(--text);
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar .filename {
      color: var(--muted);
      font-size: 0.85rem;
      font-family: Consolas, "Courier New", monospace;
    }

    .toolbar .actions {
      display: flex;
      gap: 8px;
    }

    pre {
      margin: 0;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow: auto;
      max-height: 560px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 12px;
    }

    details {
      margin-top: 4px;
    }

    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
    }

    details pre {
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--success);
      padding: 10px 16px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
    }

    @media (max-width: 600px) {
      main {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Agentic WebApp Generator</h1>
    <p>Describe your application and generate a Streamlit app, a FastAPI backend, and an HTML frontend.</p>
  </header>

  <main>
    <section class="card">
      <h2>Application specification</h2>
      <label for="spec">Describe what you want to build</label>
      <textarea id="spec" placeholder="Example: A todo app where users can add tasks, mark them as complete, and delete them. Tasks should be stored in memory and shown in a list."></textarea>

      <div class="form-footer">
        <span class="hint" id="charCount">0 characters</span>
        <button id="generateBtn" type="button">Generate code</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>Generated code</h2>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="streamlit" role="tab" disabled>Streamlit</button>
        <button class="tab" data-tab="fastapi" role="tab" disabled>FastAPI</button>
        <button class="tab" data-tab="html" role="tab" disabled>HTML</button>
      </div>

      <div id="output">
        <div class="empty">Your generated code will appear here.</div>
      </div>

      <details id="promptsDetails" hidden>
        <summary>View generated system prompts</summary>
        <pre id="promptsOutput"></pre>
      </details>
    </section>
  </main>

  <div id="toast" class="toast" role="alert"></div>

  <script src="script.js"></script>
</body>
</html>
